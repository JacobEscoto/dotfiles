shell /usr/bin/fish

font_family       FiraCode Nerd Font
font_size         11.0
bold_font         auto
italic_font       auto
bold_italic_font  auto

# Background color
background #04070B

# General transparency
background_opacity 0.95
dynamic_background_opacity no

# Cursor
cursor_shape beam
cursor_beam_thickness 2
cursor_blink_interval 0.5

# Disable beeps
enable_audio_bell no

# Reload kitty.conf
map ctrl+shift+f5 load_config_file

# Colors
foreground            #CDD6F4
background            #11111b
selection_foreground  #04070B
selection_background  #585B70
cursor                #F5A97F
cursor_text_color     #04070B
url_color             #89DCEB

active_border_color   #89DCEB
inactive_border_color #313244
bell_border_color     #F38BA8

color0  #45475A
color8  #585B70
color1  #F38BA8
color9  #F38BA8
color2  #A6E3A1
color10 #A6E3A1
color3  #F9E2AF
color11 #F9E2AF
color4  #89B4FA
color12 #89B4FA
color5  #CBA6F7
color13 #CBA6F7
color6  #94E2D5
color14 #94E2D5
color7  #F5A97F
color15 #BAC2DE

# Tab bar
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_edge top
tab_bar_align left
tab_bar_min_tabs 2

tab_bar_background #11111b
tab_bar_margin_color #11111b
tab_bar_margin_height 0.5 0.5
tab_bar_margin_width 0

active_tab_foreground #11111b
active_tab_background #89DCEB
active_tab_font_style bold

inactive_tab_foreground #A6ADC8
inactive_tab_background #181825
inactive_tab_font_style normal

bell_on_tab "  "
tab_activity_symbol " ●"

# Spacing
window_padding_width 6 5
window_margin_width 0
