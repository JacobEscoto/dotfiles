[global/wm]
margin-bottom = 0
margin-top = 0

;; File inclusion
include-file = ~/.config/polybar/colors.ini
include-file = ~/.config/polybar/modules.ini
include-file = ~/.config/polybar/user_modules.ini

[bar/base]
height = 26
line-size = 1
padding-y = 2
radius = 8

offset-y = 2

background = ${color.background}
foreground = ${color.foreground}

font-0 = JetBrainsMono Nerd Font:pixelsize=9;2
font-1 = FiraCode Nerd Font:pixelsize=10;1

enable-ipc = true
;; override-redirect = true

[bar/left]
inherit = bar/base
width = 24%
offset-x = 1%
modules-left = launcher separator xworkspaces

[bar/center]
inherit = bar/base
width = 16%
padding-left = 10
padding-right = 10
offset-x = 42%
modules-center = datetime

module-margin-left = 1
module-margin-right = 1

[bar/right]
inherit = bar/base
width = 33%
offset-x = 66%
padding-left = 2
modules-left = xkeyboard separator 
modules-center = network brightness audiomenu battery 
modules-right = systray powermenu

module-margin-left = 1
module-margin-right = 1
