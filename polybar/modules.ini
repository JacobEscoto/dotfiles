[module/i3]
type = internal/i3

ws-icon-0 = 1:web;󰈹
ws-icon-1 = 2:code;
ws-icon-2 = 3:files;󰉓
ws-icon-default = 󰍹

pin-workspaces = false
show-urgent = true
index-sort = true

enable-click = true
enable-scroll = true

format = <label-state>

label-focused = %icon%
label-focused-foreground = ${color.purple}
label-focused-padding = 2

label-unfocused = %icon%
label-unfocused-padding = 2

label-visible = %icon%
label-visible-padding = 2

label-urgent = %icon%
label-urgent-background = ${color.red}
label-urgent-padding = 2

;; -:-:-:-:-:-:-:-:-:-:-:-:-:-:-:-:-:-:-:-:-:-:-:-:

[module/battery]
type = internal/battery
full-at = 99

battery = BAT1
adapter = ACAD

poll-interval = 2

format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <ramp-capacity> <label-full>

label-charging = %percentage%%
label-discharging = %percentage%%
label-full = %percentage%%

ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
ramp-capacity-foreground = ${color.orange}

animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-framerate = 750
animation-charging-foreground = ${color.green}

;; -:-:-:-:-:-:-:-:-:-:-:-:-:-:-:-:-:-:-:-:-:-:-:-:

[module/date]
type = internal/date

; Seconds to sleep between updates
interval = 1.0

date = " %a, %d %b"
time = %I:%M %p

date-alt = " %a, %d %b %Y"
time-alt = %H:%M:%S

format = <label>
format-prefix = 
format-prefix-foreground = ${color.red}
format-prefix-font = 4

label = %date% %time%

;; -:-:-:-:-:-:-:-:-:-:-:-:-:-:-:-:-:-:-:-:-:-:-:-:

[module/network]
type = internal/network

;; Available interfaces:
;; - wlan0
;; - eth0
;; - wlp2s0 (current)
interface = wlp2s0

interval = 1.0

unknown-as-up = true

format-connected = <ramp-signal> <label-connected>

format-disconnected = <label-disconnected>
format-disconnected-prefix = 󰤭
format-disconnected-prefix-foreground = ${color.red}

label-connected = "%{A1:~/.config/rofi/scripts/network.sh &:}%essid% %{A}"
label-disconnected = "%{A1:~/.config/rofi/scripts/network.sh &:} Offline%{A}"

ramp-signal-0 = 󰤟
ramp-signal-1 = 󰤢
ramp-signal-2 = 󰤥
ramp-signal-3 = 󰤨
ramp-signal-foreground = ${color.blue}

;; -:-:-:-:-:-:-:-:-:-:-:-:-:-:-:-:-:-:-:-:-:-:-:-:

[module/brightness]
type = internal/backlight


card = intel_backlight
enable-scroll = true

format= <label>
format-prefix = 
format-prefix-foreground = ${color.lime}

label = " %percentage%%"

;; -:-:-:-:-:-:-:-:-:-:-:-:-:-:-:-:-:-:-:-:-:-:-:-:

[module/pulseaudio]
type = internal/pulseaudio

use-ui-max = false

format-volume = <ramp-volume> <label-volume>

format-muted = <label-muted>
format-muted-prefix = 
format-muted-prefix-foreground = ${color.red}

label-volume = %percentage%%

label-muted = " %percentage%%"
label-muted-foreground = ${color.muted}

ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
ramp-volume-3 = 
ramp-volume-foreground = ${color.cyan}

;; -:-:-:-:-:-:-:-:-:-:-:-:-:-:-:-:-:-:-:-:-:-:-:-:
