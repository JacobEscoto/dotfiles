name: Auto Format Dotfiles

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  format:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      # Install Go & format `.go` files
      - name: Configure Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true
          cache-dependency-path: installer/go.sum
      - name: Run gofmt
        run: |
          if find . -name "*.go" | grep -q .; then
            gofmt -s -w .
          else
            echo "`.go` files not found, skipping..."
          fi

      # Install & run shfmt for Bash scripting files
      - name: Install shfmt
        run: sudo apt-get update && sudo apt-get install -y shfmt
      - name: Run shfmt
        run: |
          if find . -name "*.sh" | grep -q .; then
            shfmt -w -i 2 -ci .
          else
            echo "`.sh` files not found, skipping..."
          fi

      # Install and run StyLua for `.lua` files (Neovim)
      - name: Run StyLua
        run: |
          if find . -name "*.lua" | grep -q .; then
            echo "`.lua` files found. Installing StyLua..."
            STYLUA_VER=$(curl -s "https://api.github.com/repos/JohnnyMorganz/stylua/releases/latest" | grep '"tag_name":' | sed -E 's/.*"v([^"]+)".*/\1/')
            curl -sL "https://github.com/JohnnyMorganz/stylua/releases/download/v${STYLUA_VER}/stylua-linux-x86_64.zip" -o stylua.zip
            unzip -q stylua.zip
            chmod +x stylua
            ./stylua .
            rm stylua stylua.zip
          else
            echo "`.lua` files not found, skipping..."
          fi

      # Format files with Prettier (JSON, YAML, MD, etc.)
      - name: Run Prettier
        run: npx --yes prettier --write "**/*.{json,yaml,yml,md}"

      # 5. Create automatic PR if format changes
      - name: Create Pull Request with the changes
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "style: code formatting and configurations"
          title: "Automatic code formatting and configurations"
          body: |
            This PR was generated automatically by GitHub Actions to apply a clean format to code (Go, Shell, Lua, etc.).
            Check the changes and merge it when wished.
          branch: "bot/auto-format"
          delete-branch: true
          signoff: true
