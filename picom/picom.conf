# Backend to use
# default: `xrender`
backend = "glx";

# Enable VSync
vsync = true;

# ====================
#   == Animations ==
# ====================
animations = (
  {
    triggers = ["open", "show"];
    preset = "appear";
    duration = 0.2;
  },
  {
    triggers = ["close", "hide"];
    preset = "disappear";
    duration = 0.2;
  }
);

# =================
#   == Opacity ==
# =================
opacity-rule = [
  "95:class_g = 'kitty'",
  "100:class_g = 'i3'"
];

# ==============
#   == Blur ==
# ==============
blur-method = "dual_kawase";
blur-background = true;
blur-strength = 3;

# =================
#   == Corners ==
# =================
corner-radius = 14.0;
corner-radius-rules = [
  "0:class_g = 'Polybar'",
  "0:class_g = 'Rofi'",
  "0:class_g = 'Dunst'",
];

# =================
#   == Shadows ==
# =================
shadow = false;
